<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVIQ Labs | Infraestructura Global</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-pure: #000000;
            --text-main: #ffffff;
            --text-dim: #777777;
            --accent: #ffffff;
            --border: #222222;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-pure); color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden; -webkit-font-smoothing: antialiased;
        }

        /* --- LAYOUT B2B (50/50) --- */
        .layout {
            display: flex; width: 100vw; height: 100vh;
        }

        /* --- PANEL IZQUIERDO: VENTAS --- */
        .ui-panel {
            width: 45%; height: 100%;
            padding: 5vw; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
            border-right: 1px solid var(--border);
            background: var(--bg-pure); z-index: 10;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-weight: 900; font-size: 1.2rem; letter-spacing: -1px; text-transform: uppercase; }
        .sys-status {
            font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px;
            display: flex; align-items: center; gap: 8px; font-weight: 600;
        }
        .dot { width: 6px; height: 6px; background: #00ff66; border-radius: 50%; box-shadow: 0 0 10px rgba(0,255,102,0.5); }

        .hero { margin-top: -5vh; }
        
        .kpi-tag {
            display: inline-block; border: 1px solid var(--border); padding: 8px 16px;
            border-radius: 100px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 25px; color: var(--text-dim);
        }

        h1 {
            font-size: clamp(3.5rem, 5vw, 5rem); font-weight: 900; line-height: 0.95; letter-spacing: -2px;
            margin: 0 0 24px 0; text-transform: uppercase;
        }

        p.lead {
            font-size: 1.15rem; line-height: 1.6; color: var(--text-dim); max-width: 450px; margin-bottom: 40px;
        }

        .btn-global {
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--text-main); color: var(--bg-pure);
            padding: 18px 40px; border-radius: 2px; font-weight: 800; font-size: 0.9rem;
            text-transform: uppercase; letter-spacing: 1px; text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-global:hover {
            transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,255,255,0.2); background: #e0e0e0;
        }

        .footer-metrics {
            display: flex; gap: 40px; border-top: 1px solid var(--border); padding-top: 30px;
        }
        .metric { display: flex; flex-direction: column; gap: 5px; }
        .metric-val { font-size: 1.2rem; font-weight: 800; }
        .metric-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

        /* --- PANEL DERECHO: EL GLOBO --- */
        #globe-wrapper {
            width: 55%; height: 100%; position: relative;
            background: radial-gradient(circle at center, #0a0a0a 0%, var(--bg-pure) 100%);
            cursor: grab;
        }
        #globe-wrapper:active { cursor: grabbing; }

        @media (max-width: 900px) {
            .layout { flex-direction: column; overflow-y: auto; }
            .ui-panel { width: 100%; min-height: 100vh; padding: 40px 20px; border-right: none; }
            #globe-wrapper { width: 100%; height: 60vh; border-top: 1px solid var(--border); }
            h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="layout">
        
        <div class="ui-panel">
            <header>
                <div class="logo">AIVIQ LABS</div>
                <div class="sys-status"><div class="dot"></div> Enrutamiento Activo</div>
            </header>

            <div class="hero">
                <div class="kpi-tag">Telecomunicaciones Neuronales</div>
                <h1>Escala<br>Absoluta.</h1>
                <p class="lead">Despliega infraestructura de voz inteligente. Agentes autónomos que cualifican prospectos y llenan tu calendario 24/7 sin latencia.</p>
                <a href="https://zcal.co/mario/30min" target="_blank" class="btn-global">Iniciar Despliegue</a>
            </div>

            <div class="footer-metrics">
                <div class="metric">
                    <span class="metric-val">100%</span>
                    <span class="metric-label">Tasa de Respuesta</span>
                </div>
                <div class="metric">
                    <span class="metric-val">Cero</span>
                    <span class="metric-label">Fricción Comercial</span>
                </div>
            </div>
        </div>

        <div id="globe-wrapper"></div>

    </div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl@2.28.1/dist/globe.gl.min.js"></script>

    <script>
        // 1. DIMENSIONES DEL CONTENEDOR DERECHO
        const wrapper = document.getElementById('globe-wrapper');
        let globeWidth = wrapper.clientWidth;
        let globeHeight = wrapper.clientHeight;

        // 2. INICIALIZACIÓN DEL GLOBO (Estilo Minimalista B/N)
        const myGlobe = Globe()(wrapper)
            .width(globeWidth)
            .height(globeHeight)
            .backgroundColor('rgba(0,0,0,0)') // Fondo transparente para ver el gradiente CSS
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg') // Mapa B/N de alta fiabilidad
            .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
            .showAtmosphere(true)
            .atmosphereColor('#ffffff')
            .atmosphereAltitude(0.15);

        // 3. ENRUTAMIENTO DE SEÑALES (Arcos desde Madrid al mundo)
        const ORIGIN = { lat: 40.4168, lng: -3.7038 }; // Coordenadas del nodo central
        
        const DESTINATIONS = [
            { lat: 40.7128, lng: -74.0060 },   // New York
            { lat: 37.7749, lng: -122.4194 },  // San Francisco
            { lat: 43.6150, lng: -116.2023 },  // Boise
            { lat: 51.5074, lng: -0.1278 },    // London
            { lat: 35.6895, lng: 139.6917 },   // Tokyo
            { lat: 1.3521, lng: 103.8198 },    // Singapore
            { lat: -23.5505, lng: -46.6333 },  // Sao Paulo
            { lat: -33.8688, lng: 151.2093 }   // Sydney
        ];

        // Datos de los arcos
        const arcsData = DESTINATIONS.map(dest => ({
            startLat: ORIGIN.lat,
            startLng: ORIGIN.lng,
            endLat: dest.lat,
            endLng: dest.lng,
            color: '#ffffff'
        }));

        myGlobe
            .arcsData(arcsData)
            .arcColor('color')
            .arcDashLength(0.4)
            .arcDashGap(1.5)
            .arcDashInitialGap(() => Math.random() * 5)
            .arcDashAnimateTime(2500)
            .arcStroke(1.2) // Grosor de los haces de luz
            .arcAltitudeAutoScale(0.4);

        // Datos de los Nodos (Anillos pulsantes)
        const ringsData = [ORIGIN, ...DESTINATIONS];
        myGlobe
            .ringsData(ringsData)
            .ringColor(() => '#ffffff')
            .ringMaxRadius(4)
            .ringPropagationSpeed(3)
            .ringRepeatPeriod(800);

        // 4. CONFIGURACIÓN DE LA CÁMARA
        // Centramos la vista inicial entre Europa y América
        myGlobe.pointOfView({ lat: 35, lng: -30, altitude: 2.2 });

        // Rotación automática suave
        myGlobe.controls().autoRotate = true;
        myGlobe.controls().autoRotateSpeed = 0.8;
        myGlobe.controls().enableZoom = false; // Desactivar zoom evita que el usuario se pierda

        // 5. RESPONSIVIDAD (Ajuste perfecto al cambiar el tamaño de la ventana)
        window.addEventListener('resize', () => {
            globeWidth = wrapper.clientWidth;
            globeHeight = wrapper.clientHeight;
            myGlobe.width(globeWidth).height(globeHeight);
        });

    </script>
</body>
</html>
