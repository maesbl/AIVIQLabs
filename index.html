<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVIQ Labs | Agentes de Voz IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- RESET & VARIABLES --- */
        :root {
            --bg-dark: #050505;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            overflow: hidden; 
        }

        /* --- 3D CANVAS --- */
        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1;
            cursor: grab;
        }
        #canvas-container:active { cursor: grabbing; }

        /* --- INTERFAZ FLOTANTE (UI) --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            box-sizing: border-box;
        }

        /* Nav */
        header {
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo {
            font-weight: 900; font-size: 1.5rem; letter-spacing: -1px; text-transform: uppercase;
        }
        .status {
            font-size: 0.8rem; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase;
            display: flex; align-items: center; gap: 8px;
        }
        .status-dot {
            width: 8px; height: 8px; background-color: #00ff66; border-radius: 50%;
            box-shadow: 0 0 10px #00ff66;
        }

        /* Contenido Central (A la izquierda) */
        .hero-content {
            max-width: 500px;
            pointer-events: auto; 
        }
        h1 {
            font-size: 4.5rem; font-weight: 900; line-height: 1; margin: 0 0 20px 0; letter-spacing: -2px;
        }
        p {
            font-size: 1.1rem; line-height: 1.6; color: var(--text-muted); margin-bottom: 40px;
        }

        /* Botón Premium */
        .btn {
            display: inline-block;
            background: #ffffff; color: #000000;
            padding: 16px 32px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            border: none; border-radius: 100px; cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease;
            text-decoration: none;
        }
        .btn:hover {
            transform: scale(1.05); background: #e0e0e0;
        }

        /* Instrucción de Interacción */
        .interaction-hint {
            position: absolute;
            bottom: 40px; right: 40px;
            text-align: right; font-size: 0.8rem; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase;
        }

        /* Layout Responsivo */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .ui-layer { padding: 20px; }
            .hero-content { margin-top: auto; margin-bottom: 60px; }
            .interaction-hint { display: none; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <header>
            <div class="logo">AIVIQ Labs</div>
            <div class="status">
                <div class="status-dot"></div> Sistemas Operativos
            </div>
        </header>

        <div class="hero-content">
            <h1>LA VOZ<br>DE TU<br>NEGOCIO.</h1>
            <p>Implementamos agentes telefónicos impulsados por Inteligencia Artificial. Responden al instante, cualifican leads y agendan citas 24/7 sin intervención humana.</p>
            <a href="https://zcal.co/mario/30min" target="_blank" class="btn">Automatizar Mis Llamadas</a>
        </div>

        <div class="interaction-hint">
            [ Haz clic y arrastra para rotar el núcleo ]
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. CONFIGURACIÓN BASE DEL ENTORNO 3D
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 0, 10); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = false; 
        controls.enablePan = false;

        // 2. ILUMINACIÓN PREMIUM
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0x4444ff, 2); 
        backLight.position.set(-5, -5, -5);
        scene.add(backLight);

        // 3. CONSTRUCCIÓN DEL OBJETO 3D
        const coreGroup = new THREE.Group();
        coreGroup.position.x = 2; 
        scene.add(coreGroup);

        const metalMaterial = new THREE.MeshStandardMaterial({
            color: 0x111111,
            metalness: 0.9,
            roughness: 0.2,
            wireframe: false
        });

        const ring1Geo = new THREE.TorusGeometry(2.5, 0.1, 16, 100);
        const ring1 = new THREE.Mesh(ring1Geo, metalMaterial);
        coreGroup.add(ring1);

        const ring2Geo = new THREE.TorusGeometry(2, 0.15, 16, 100);
        const ring2 = new THREE.Mesh(ring2Geo, metalMaterial);
        ring2.rotation.x = Math.PI / 2;
        coreGroup.add(ring2);

        const coreGeo = new THREE.IcosahedronGeometry(1.2, 0);
        const coreMaterial = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            wireframe: true,
            emissive: 0x333333
        });
        const core = new THREE.Mesh(coreGeo, coreMaterial);
        coreGroup.add(core);

        // 4. BUCLE DE ANIMACIÓN
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            ring1.rotation.y = elapsedTime * 0.2;
            ring1.rotation.x = elapsedTime * 0.1;
            
            ring2.rotation.y = elapsedTime * 0.3;
            ring2.rotation.z = elapsedTime * 0.15;

            core.rotation.y = elapsedTime * -0.5;
            core.rotation.x = elapsedTime * -0.2;

            coreGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.1;

            controls.update(); 
            renderer.render(scene, camera);
        }

        animate();

        // 5. RESPONSIVIDAD
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            if (window.innerWidth < 768) {
                coreGroup.position.x = 0;
                coreGroup.position.y = 2;
                camera.position.z = 12;
            } else {
                coreGroup.position.x = 2;
                coreGroup.position.y = 0;
                camera.position.z = 10;
            }
        });

        window.dispatchEvent(new Event('resize'));

    </script>
</body>
</html>
