<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVIQ Labs | Next-Gen Voice AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- RESET & VARIABLES GLOBALES --- */
        :root {
            --bg-dark: #020205;
            --text-main: #ffffff;
            --text-muted: #8888a0;
            --accent-cyan: #00f2ff;
            --accent-blue: #0044ff;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark);
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-main);
            overflow: hidden; 
        }

        /* --- OVERLAYS DE FONDO (Grid y Viñeta) --- */
        .bg-grid {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            opacity: 0.5;
        }
        .vignette {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2;
            background: radial-gradient(circle at center, transparent 30%, var(--bg-dark) 100%);
            pointer-events: none;
        }

        /* --- 3D CANVAS --- */
        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;
            cursor: grab;
            animation: fadeIn 2s ease-in-out;
        }
        #canvas-container:active { cursor: grabbing; }

        /* --- INTERFAZ FLOTANTE (UI) --- */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; 
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 50px 60px; box-sizing: border-box;
        }

        /* Nav */
        header {
            display: flex; justify-content: space-between; align-items: center;
            animation: slideDown 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .logo {
            font-weight: 900; font-size: 1.8rem; letter-spacing: -1px; text-transform: uppercase;
            background: linear-gradient(90deg, #fff, var(--text-muted));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .status {
            font-size: 0.85rem; color: var(--text-muted); letter-spacing: 3px; text-transform: uppercase;
            display: flex; align-items: center; gap: 10px; font-weight: 700;
            background: rgba(255,255,255,0.03); padding: 8px 16px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .status-dot {
            width: 8px; height: 8px; background-color: var(--accent-cyan); border-radius: 50%;
            box-shadow: 0 0 15px var(--accent-cyan);
            animation: pulse 2s infinite;
        }

        /* Contenido Central */
        .hero-content {
            max-width: 600px; pointer-events: auto; 
            animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        h1 {
            font-size: 5.5rem; font-weight: 900; line-height: 0.95; margin: 0 0 25px 0; letter-spacing: -3px;
        }
        h1 span {
            color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,0.3);
        }
        p {
            font-size: 1.2rem; line-height: 1.6; color: var(--text-muted); margin-bottom: 45px; font-weight: 300;
        }

        /* Botón Premium (Glassmorphism Avanzado) */
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.05); color: #ffffff;
            padding: 18px 40px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); text-decoration: none;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            position: relative; overflow: hidden;
        }
        .btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .btn:hover {
            background: #ffffff; color: #000000; border-color: #ffffff;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.4); transform: translateY(-2px);
        }
        .btn:hover::before { left: 100%; }

        /* Instrucción de Interacción */
        .interaction-hint {
            position: absolute; bottom: 50px; right: 60px;
            text-align: right; font-size: 0.75rem; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase;
            animation: fadeIn 2s ease-in-out 1s both;
        }

        /* Animaciones CSS */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { opacity: 0.5; box-shadow: 0 0 5px var(--accent-cyan); } 50% { opacity: 1; box-shadow: 0 0 20px var(--accent-cyan); } 100% { opacity: 0.5; box-shadow: 0 0 5px var(--accent-cyan); } }

        /* Layout Responsivo */
        @media (max-width: 900px) {
            h1 { font-size: 4rem; }
            .ui-layer { padding: 30px; }
            .hero-content { margin-top: auto; margin-bottom: 80px; }
            .interaction-hint { display: none; }
        }
        @media (max-width: 480px) {
            h1 { font-size: 3rem; }
            .status span { display: none; }
            .btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="vignette"></div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <header>
            <div class="logo">AIVIQ Labs</div>
            <div class="status">
                <div class="status-dot"></div> <span>Red Neuronal Activa</span>
            </div>
        </header>

        <div class="hero-content">
            <h1>LA VOZ<br><span>DE TU</span><br>NEGOCIO.</h1>
            <p>Implementamos agentes telefónicos impulsados por Inteligencia Artificial. Responden al instante, cualifican leads y agendan citas 24/7 sin intervención humana.</p>
            <a href="https://zcal.co/mario/30min" target="_blank" class="btn">Automatizar Mis Llamadas</a>
        </div>

        <div class="interaction-hint">
            [ Interfaz Cuántica: Arrastrar para inspeccionar ]
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. CONFIGURACIÓN BASE DEL ENTORNO 3D ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // Niebla sutil para integrar el modelo con el fondo oscuro
        scene.fog = new THREE.FogExp2(0x020205, 0.02);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 1, 12); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        // Tone mapping para colores más realistas y brillantes
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.04;
        controls.enableZoom = false; 
        controls.enablePan = false;
        controls.autoRotate = true; // Rotación automática cinemática
        controls.autoRotateSpeed = 0.5;

        // --- 2. ILUMINACIÓN PREMIUM DE ESTUDIO ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
        scene.add(ambientLight);

        // Luz principal fría (Cian)
        const light1 = new THREE.PointLight(0x00f2ff, 5, 50);
        light1.position.set(5, 5, 5);
        scene.add(light1);

        // Luz secundaria profunda (Azul)
        const light2 = new THREE.PointLight(0x0044ff, 8, 50);
        light2.position.set(-5, -5, -2);
        scene.add(light2);

        // Luz de contra (Blanca) para perfilar los bordes metálicos
        const backLight = new THREE.DirectionalLight(0xffffff, 1);
        backLight.position.set(0, 10, -10);
        scene.add(backLight);

        // --- 3. CONSTRUCCIÓN DEL OBJETO 3D (ULTRA MODERNO) ---
        const coreGroup = new THREE.Group();
        coreGroup.position.x = 2.5; 
        scene.add(coreGroup);

        // A. Material Metálico Pulido (Anillos)
        const metalMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a24,
            metalness: 1,
            roughness: 0.15,
            envMapIntensity: 1
        });

        // B. Material de Cristal Refractante (Núcleo Exterior)
        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            metalness: 0.1,
            roughness: 0.05,
            transmission: 0.9, // Esto crea el efecto de cristal real
            thickness: 0.5,
            ior: 1.5,
            clearcoat: 1,
            clearcoatRoughness: 0.1
        });

        // C. Material Emisivo (Núcleo de Energía Interior)
        const energyMaterial = new THREE.MeshBasicMaterial({
            color: 0x00f2ff,
            wireframe: true,
            transparent: true,
            opacity: 0.3
        });

        // Ensamblaje de geometrías
        const ring1 = new THREE.Mesh(new THREE.TorusGeometry(2.8, 0.02, 32, 100), metalMaterial);
        coreGroup.add(ring1);

        const ring2 = new THREE.Mesh(new THREE.TorusGeometry(2.3, 0.05, 32, 100), metalMaterial);
        ring2.rotation.x = Math.PI / 2;
        coreGroup.add(ring2);

        const outerGlassCore = new THREE.Mesh(new THREE.IcosahedronGeometry(1.4, 1), glassMaterial);
        coreGroup.add(outerGlassCore);

        const innerEnergyCore = new THREE.Mesh(new THREE.IcosahedronGeometry(1.1, 2), energyMaterial);
        coreGroup.add(innerEnergyCore);

        // --- 4. SISTEMA DE PARTÍCULAS (DATA DUST) ---
        const particleCount = 1500;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);

        for(let i = 0; i < particleCount * 3; i++) {
            // Distribuir partículas en una esfera alrededor del núcleo
            const radius = 3 + Math.random() * 5;
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos((Math.random() * 2) - 1);
            
            particlePos[i] = radius * Math.sin(phi) * Math.cos(theta);
            particlePos[i+1] = radius * Math.sin(phi) * Math.sin(theta);
            particlePos[i+2] = radius * Math.cos(phi);
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0x00f2ff,
            size: 0.03,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending
        });
        
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        coreGroup.add(particleSystem);


        // --- 5. BUCLE DE ANIMACIÓN CINEMÁTICA ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Rotaciones complejas independientes
            ring1.rotation.y = elapsedTime * 0.3;
            ring1.rotation.x = elapsedTime * 0.2;
            
            ring2.rotation.y = elapsedTime * 0.4;
            ring2.rotation.z = elapsedTime * 0.15;

            outerGlassCore.rotation.y = elapsedTime * -0.1;
            innerEnergyCore.rotation.y = elapsedTime * 0.2;
            innerEnergyCore.rotation.x = elapsedTime * 0.1;

            particleSystem.rotation.y = elapsedTime * 0.05;

            // Flotación sutil (Respiración)
            coreGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.15;

            // Pulsación de la energía interior
            const scale = 1 + Math.sin(elapsedTime * 3) * 0.05;
            innerEnergyCore.scale.set(scale, scale, scale);

            controls.update(); 
            renderer.render(scene, camera);
        }

        animate();

        // --- 6. RESPONSIVIDAD DINÁMICA ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            if (window.innerWidth < 900) {
                coreGroup.position.x = 0;
                coreGroup.position.y = 2.5;
                camera.position.z = 14;
            } else {
                coreGroup.position.x = 2.5;
                coreGroup.position.y = 0;
                camera.position.z = 12;
            }
        });

        // Trigger inicial
        window.dispatchEvent(new Event('resize'));

    </script>
</body>
</html>
